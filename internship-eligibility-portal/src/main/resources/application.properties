# =========================================================
# Internship Management & Eligibility Portal - Master Config
# =========================================================

spring.application.name=internship-eligibility-portal

# ---- Active Profile ----
# Default is "demo" (in-memory H2 with seed data). Use "dev" or "prod" for MySQL.
spring.profiles.active=demo

# ---- Database Settings (Environment Variable Aware) ----
spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:mysql://localhost:3306/internship_portal?createDatabaseIfNotExist=true&useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:root}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:root}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# ---- JPA & Hibernate ----
# Hibernate validates against Flyway migrations
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=false
spring.jpa.open-in-view=false

# ---- Flyway Database Migrations ----
spring.flyway.enabled=true
spring.flyway.baseline-on-migrate=true
spring.flyway.locations=classpath:db/migration

# ---- JWT & Auth Security ----
app.jwt.secret=${JWT_SECRET:change-this-super-secret-key-before-deploying-1234567890}
app.jwt.expiration-ms=${JWT_EXPIRATION_MS:900000}
app.jwt.refresh-expiration-ms=${JWT_REFRESH_EXPIRATION_MS:604800000}

# ---- CORS Settings ----
app.cors.allowed-origins=${APP_CORS_ALLOWED_ORIGINS:http://localhost:5173,http://localhost:3000,http://localhost:8080}

# ---- Business Rules ----
app.require-verification=${APP_REQUIRE_VERIFICATION:true}
app.require-internship-approval=${APP_REQUIRE_INTERNSHIP_APPROVAL:true}

# ---- File Uploads ----
app.upload-dir=${APP_UPLOAD_DIR:uploads}
spring.servlet.multipart.max-file-size=5MB
spring.servlet.multipart.max-request-size=6MB

# ---- Mail Configuration ----
spring.mail.host=${SPRING_MAIL_HOST:localhost}
spring.mail.port=${SPRING_MAIL_PORT:1025}
spring.mail.username=${SPRING_MAIL_USERNAME:}
spring.mail.password=${SPRING_MAIL_PASSWORD:}
spring.mail.properties.mail.smtp.auth=false
spring.mail.properties.mail.smtp.starttls.enable=false

# ---- Observability & Actuator ----
management.endpoints.web.exposure.include=health,info,metrics
management.endpoint.health.show-details=always

# ---- Springdoc OpenAPI / Swagger ----
springdoc.swagger-ui.path=/swagger-ui.html
springdoc.api-docs.path=/v3/api-docs

server.port=${PORT:8080}
