<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<title>Faculty Dashboard</title>
<meta name="viewport" content="width=device-width, initial-scale=1" />
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
<link href="css/style.css" rel="stylesheet">
</head>
<body>
<nav class="navbar navbar-portal mb-4">
  <div class="container">
    <span class="navbar-brand mb-0 h5">Faculty Portal</span>
    <span>
      <span id="userEmail" class="me-3"></span>
      <button class="btn btn-sm btn-outline-light" onclick="logout()">Log out</button>
    </span>
  </div>
</nav>

<div class="container pb-5">
  <div id="alert" class="alert d-none"></div>

  <ul class="nav nav-pills mb-4" id="tabs">
    <li class="nav-item"><button class="nav-link active" data-tab="students">Student Verification</button></li>
    <li class="nav-item"><button class="nav-link" data-tab="applications">Applications &amp; Shortlisting</button></li>
    <li class="nav-item"><button class="nav-link" data-tab="approvals">Internship Approvals</button></li>
    <li class="nav-item"><button class="nav-link" data-tab="reports">Reports &amp; Analytics</button></li>
  </ul>

  <div class="tab-pane" id="tab-students">
    <h5 class="mb-3">Students</h5>
    <div class="table-responsive">
      <table class="table bg-white card-portal align-middle">
        <thead><tr><th>Name</th><th>PRN</th><th>Branch</th><th>Sem</th><th>CGPA</th><th>Backlogs</th><th>Status</th><th></th></tr></thead>
        <tbody id="studentsBody"></tbody>
      </table>
    </div>
    <div id="docPanel" class="card card-portal p-3 d-none"></div>
  </div>

  <div class="tab-pane d-none" id="tab-applications">
    <h5 class="mb-3">All Applications</h5>
    <p class="small text-muted">Eligible → resume match → ATR score → <b>faculty filter</b> → company shortlist. Record the ATR score first if the internship sets a minimum.</p>
    <div class="table-responsive">
      <table class="table bg-white card-portal align-middle">
        <thead><tr><th>Student</th><th>Internship</th><th>Resume match</th><th>Status</th><th></th></tr></thead>
        <tbody id="applicationsBody"></tbody>
      </table>
    </div>
  </div>

  <div class="tab-pane d-none" id="tab-approvals">
    <h5 class="mb-3">Internships Pending Approval</h5>
    <div id="approvalsList"></div>
  </div>

  <div class="tab-pane d-none" id="tab-reports">
    <h5 class="mb-3">Reports &amp; Analytics</h5>
    <div id="reportCards" class="row g-3"></div>
  </div>
</div>

<script src="js/api.js"></script>
<script src="js/report.js"></script>
<script src="js/faculty.js"></script>
</body>
</html>
