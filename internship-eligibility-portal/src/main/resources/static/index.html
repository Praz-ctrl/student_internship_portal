<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<title>Internship &amp; Eligibility Portal — Login</title>
<meta name="viewport" content="width=device-width, initial-scale=1" />
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
<link href="css/style.css" rel="stylesheet">
</head>
<body>
<div class="container py-5">
  <div class="row justify-content-center">
    <div class="col-md-8 col-lg-6">
      <div class="hero-auth text-center mb-4">
        <h3 class="mb-1">Internship Management &amp; Eligibility Portal</h3>
        <p class="mb-0 opacity-75">Student · Faculty · Company sign in</p>
      </div>
      <div class="card card-portal p-4">
        <div id="alert" class="alert d-none"></div>
        <form id="loginForm">
          <div class="mb-3">
            <label class="form-label">Email</label>
            <input type="email" class="form-control" id="email" required>
          </div>
          <div class="mb-3">
            <label class="form-label">Password</label>
            <input type="password" class="form-control" id="password" required>
          </div>
          <button type="submit" class="btn btn-primary w-100">Log In</button>
        </form>
        <p class="text-center mt-3 mb-0"><a href="register.html">Don't have an account? Register</a></p>
        <hr>
        <p class="small text-muted mb-0">Demo accounts (password: <code>password123</code>):<br>
          student@demo.com (verified) &nbsp;·&nbsp; student2@demo.com (unverified) &nbsp;·&nbsp; faculty@demo.com &nbsp;·&nbsp; company@demo.com &nbsp;·&nbsp; admin@demo.com</p>
      </div>
    </div>
  </div>
</div>

<script src="js/api.js"></script>
<script>
document.getElementById('loginForm').addEventListener('submit', async (e) => {
  e.preventDefault();
  try {
    const data = await api('/auth/login', 'POST', {
      email: document.getElementById('email').value,
      password: document.getElementById('password').value
    });
    localStorage.setItem('token', data.token);
    localStorage.setItem('role', data.role);
    localStorage.setItem('email', data.email);
    localStorage.setItem('profileId', data.profileId);

    if (data.role === 'STUDENT') window.location.href = 'student.html';
    else if (data.role === 'COMPANY') window.location.href = 'company.html';
    else if (data.role === 'FACULTY') window.location.href = 'faculty.html';
    else if (data.role === 'ADMIN') window.location.href = 'admin.html';
    else window.location.href = 'index.html';
  } catch (err) {
    showAlert('alert', err.message);
  }
});
</script>
</body>
</html>
