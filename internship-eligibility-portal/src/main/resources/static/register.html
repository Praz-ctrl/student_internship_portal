<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<title>Register — Internship &amp; Eligibility Portal</title>
<meta name="viewport" content="width=device-width, initial-scale=1" />
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
<link href="css/style.css" rel="stylesheet">
</head>
<body>
<div class="container py-5">
  <div class="row justify-content-center">
    <div class="col-md-8 col-lg-6">
      <div class="hero-auth text-center mb-4">
        <h3 class="mb-1">Create an Account</h3>
        <p class="mb-0 opacity-75">Choose your role to get started</p>
      </div>
      <div class="card card-portal p-4">
        <div id="alert" class="alert d-none"></div>
        <form id="regForm">
          <div class="mb-3">
            <label class="form-label">I am a...</label>
            <select class="form-select" id="role" onchange="toggleFields()">
              <option value="STUDENT">Student</option>
              <option value="FACULTY">Faculty</option>
              <option value="COMPANY">Company</option>
            </select>
          </div>
          <div class="mb-3">
            <label class="form-label">Email</label>
            <input type="email" class="form-control" id="email" required>
          </div>
          <div class="mb-3">
            <label class="form-label">Password</label>
            <input type="password" class="form-control" id="password" required>
          </div>

          <div id="studentFields">
            <div class="mb-3"><label class="form-label">Full Name</label><input class="form-control" id="name"></div>
            <div class="mb-3"><label class="form-label">PRN</label><input class="form-control" id="prn"></div>
            <div class="mb-3"><label class="form-label">Department / Branch</label><input class="form-control" id="department" placeholder="e.g. CSE"></div>
          </div>

          <div id="facultyFields" class="d-none">
            <div class="mb-3"><label class="form-label">Full Name</label><input class="form-control" id="facultyName"></div>
            <div class="mb-3"><label class="form-label">Department</label><input class="form-control" id="facultyDepartment"></div>
          </div>

          <div id="companyFields" class="d-none">
            <div class="mb-3"><label class="form-label">Company Name</label><input class="form-control" id="companyName"></div>
            <div class="mb-3"><label class="form-label">Industry</label><input class="form-control" id="industry"></div>
          </div>

          <button type="submit" class="btn btn-primary w-100">Register</button>
        </form>
        <p class="text-center mt-3 mb-0"><a href="index.html">Already have an account? Log in</a></p>
      </div>
    </div>
  </div>
</div>

<script src="js/api.js"></script>
<script>
function toggleFields() {
  const role = document.getElementById('role').value;
  document.getElementById('studentFields').classList.toggle('d-none', role !== 'STUDENT');
  document.getElementById('facultyFields').classList.toggle('d-none', role !== 'FACULTY');
  document.getElementById('companyFields').classList.toggle('d-none', role !== 'COMPANY');
}

document.getElementById('regForm').addEventListener('submit', async (e) => {
  e.preventDefault();
  const role = document.getElementById('role').value;
  const payload = {
    email: document.getElementById('email').value,
    password: document.getElementById('password').value,
    role: role
  };
  if (role === 'STUDENT') {
    payload.name = document.getElementById('name').value;
    payload.prn = document.getElementById('prn').value;
    payload.department = document.getElementById('department').value;
  } else if (role === 'FACULTY') {
    payload.name = document.getElementById('facultyName').value;
    payload.facultyDepartment = document.getElementById('facultyDepartment').value;
  } else if (role === 'COMPANY') {
    payload.companyName = document.getElementById('companyName').value;
    payload.industry = document.getElementById('industry').value;
  }

  try {
    const data = await api('/auth/register', 'POST', payload);
    localStorage.setItem('token', data.token);
    localStorage.setItem('role', data.role);
    localStorage.setItem('email', data.email);
    localStorage.setItem('profileId', data.profileId);

    if (data.role === 'STUDENT') window.location.href = 'student.html';
    else if (data.role === 'COMPANY') window.location.href = 'company.html';
    else window.location.href = 'faculty.html';
  } catch (err) {
    showAlert('alert', err.message);
  }
});
</script>
</body>
</html>
